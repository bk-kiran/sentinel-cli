[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-cli"
version = "0.1.0"
description = "An agentic pre-commit code guardian for Python projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["cli", "git", "code-review", "ai", "agents", "pre-commit"]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "anthropic>=0.28",
    "langgraph>=0.2",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "gitpython>=3.1",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
